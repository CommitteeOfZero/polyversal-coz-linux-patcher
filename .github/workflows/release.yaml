name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build archives
        run: ./scripts/makerel.sh "$GITHUB_REF_NAME"
      - name: Upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          files=(release/Polyversal-v"$tag".{zip,tar.gz})

          gh release upload "$tag" "${files[@]}" --clobber
