name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archives
        run: ./scripts/makerel.sh "$GITHUB_REF_NAME"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"                    \
            release/Polyversal-v"$GITHUB_REF_NAME".{zip,tar.gz}  \
            --title "v$GITHUB_REF_NAME" --generate-notes
